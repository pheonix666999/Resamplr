name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format cmake ninja-build libasound2-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev
      - name: Validate source and schema
        run: |
          git diff --check
          python3 scripts/check-format.py
          python3 scripts/verify-realtime-code.py
          python3 scripts/verify-project-schema.py
      - name: Configure, build, and test Debug
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-logs
          {
            cmake --preset tests-debug --fresh &&
            cmake --build --preset tests-debug &&
            ctest --preset tests-debug --output-on-failure &&
            ./build/tests-debug/bin/padflow_smoke &&
            ./build/tests-debug/bin/PadFlow --headless-smoke-test --no-audio-device
          } 2>&1 | tee artifacts/ci-logs/linux-debug.log || {
            status=${PIPESTATUS[0]}
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              printf '::error title=Linux Debug failure::%s\n' "$line"
            done < <(tail -n 40 artifacts/ci-logs/linux-debug.log)
            exit "$status"
          }
      - name: Configure, build, and test Release
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-logs
          {
            cmake --preset tests-release --fresh &&
            cmake --build --preset tests-release &&
            ctest --preset tests-release --output-on-failure
          } 2>&1 | tee artifacts/ci-logs/linux-release.log || {
            status=${PIPESTATUS[0]}
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              printf '::error title=Linux Release failure::%s\n' "$line"
            done < <(tail -n 40 artifacts/ci-logs/linux-release.log)
            exit "$status"
          }
      # actions/upload-artifact v7.0.1
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-test-logs
          path: |
            build/**/Testing/Temporary/**
            artifacts/ci-logs/*.log

  windows-x64:
    runs-on: windows-2025
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Configure and build Debug and Release
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "PADFLOW_VS_PATH=%%i"
          if not defined PADFLOW_VS_PATH (
            echo No Visual Studio installation with the MSVC x64 tools was found.
            exit /b 1
          )
          call "%PADFLOW_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake --preset windows-debug --fresh
          if errorlevel 1 exit /b %errorlevel%
          cmake --build --preset windows-debug
          if errorlevel 1 exit /b %errorlevel%
          ctest --preset windows-debug --output-on-failure
          if errorlevel 1 exit /b %errorlevel%
          cmake --preset windows-release --fresh
          if errorlevel 1 exit /b %errorlevel%
          cmake --build --preset windows-release
          if errorlevel 1 exit /b %errorlevel%
          if not exist "build\windows-release\lib\VST3\PadFlow.vst3\Contents\Resources\moduleinfo.json" exit /b 1
          dumpbin /dependents "build\windows-release\bin\PadFlow.exe" > "build\windows-release\PadFlow-dependencies.txt"
          dumpbin /dependents "build\windows-release\lib\VST3\PadFlow.vst3\Contents\x86_64-win\PadFlow.vst3" > "build\windows-release\PadFlow-VST3-dependencies.txt"
          findstr /i "VCRUNTIME MSVCP" "build\windows-release\PadFlow-dependencies.txt" && exit /b 1 || ver > nul
          findstr /i "VCRUNTIME MSVCP" "build\windows-release\PadFlow-VST3-dependencies.txt" && exit /b 1 || ver > nul
      - name: Test and smoke
        run: |
          $env:PADFLOW_SCREENSHOT_DIR = "$env:GITHUB_WORKSPACE\artifacts\screenshots"
          ctest --preset windows-release --output-on-failure
          .\build\windows-release\bin\padflow_smoke.exe
          .\build\windows-release\bin\padflow_plugin_smoke.exe
          .\build\windows-release\bin\PadFlow.exe --headless-smoke-test --no-audio-device
      - name: Validate VST3 with pluginval strictness 10
        shell: powershell
        timeout-minutes: 10
        run: |
          $archive = "$env:RUNNER_TEMP\pluginval_Windows.zip"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $archive
          $expected = "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "pluginval checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP\pluginval"
          New-Item -ItemType Directory -Force -Path artifacts\pluginval | Out-Null
          $arguments = @(
            "--validate-in-process",
            "--strictness-level", "10",
            "--output-dir", (Resolve-Path artifacts\pluginval).Path,
            (Resolve-Path build\windows-release\lib\VST3\PadFlow.vst3).Path
          )
          $validation = Start-Process -FilePath "$env:RUNNER_TEMP\pluginval\pluginval.exe" -ArgumentList $arguments -PassThru -Wait
          if ($validation.ExitCode -ne 0) { exit $validation.ExitCode }
          $logs = @(Get-ChildItem -LiteralPath artifacts\pluginval -Filter *.txt -File)
          if ($logs.Count -ne 1) { throw "expected one completed pluginval log, found $($logs.Count)" }
          if ($logs[0].Length -eq 0 -or -not (Select-String -LiteralPath $logs[0].FullName -Pattern '^SUCCESS$' -Quiet)) {
            throw "pluginval did not produce a completed SUCCESS log"
          }
      - name: Upload Milestone 4 UI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: milestone4-ui-screenshots
          path: artifacts/screenshots/*.png
      - name: Upload VST3 validator log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-pluginval-log
          path: artifacts/pluginval/*.txt
      - name: Create unsigned development archive
        shell: powershell
        run: scripts\package-windows.ps1 -DevelopmentArchive
      - name: Verify archive
        run: python scripts/verify-artifacts.py --mode milestone1 --platform windows
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-development
          path: artifacts/windows/*

  macos-universal:
    runs-on: macos-15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Configure and build universal Release
        run: |
          cmake --preset macos-universal-release --fresh
          cmake --build --preset macos-universal-release
      - name: Test, smoke, and inspect architectures
        run: |
          ctest --preset macos-universal-release --output-on-failure
          ./build/macos-universal-release/bin/padflow_smoke
          ./build/macos-universal-release/bin/padflow_plugin_smoke
          ./build/macos-universal-release/bin/PadFlow.app/Contents/MacOS/PadFlow --headless-smoke-test --no-audio-device
          lipo -archs build/macos-universal-release/bin/PadFlow.app/Contents/MacOS/PadFlow | grep arm64 | grep x86_64
          lipo -archs build/macos-universal-release/lib/VST3/PadFlow.vst3/Contents/MacOS/PadFlow | grep arm64 | grep x86_64
          lipo -archs build/macos-universal-release/lib/AU/PadFlow.component/Contents/MacOS/PadFlow | grep arm64 | grep x86_64
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto build/macos-universal-release/lib/AU/PadFlow.component "$HOME/Library/Audio/Plug-Ins/Components/PadFlow.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu PdFw Amma
      - name: Create unsigned development archive
        run: bash scripts/package-macos.sh --development-archive
      - name: Verify archive
        run: python3 scripts/verify-artifacts.py --mode milestone1 --platform macos
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-development
          path: artifacts/macos/*

  macos-intel-smoke:
    runs-on: macos-15-intel
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Configure, build, and test Intel Release
        run: |
          cmake --preset macos-intel-release --fresh
          cmake --build --preset macos-intel-release
          ctest --preset macos-intel-release --output-on-failure
          ./build/macos-intel-release/bin/padflow_smoke
          ./build/macos-intel-release/bin/padflow_plugin_smoke
          ./build/macos-intel-release/bin/PadFlow.app/Contents/MacOS/PadFlow --headless-smoke-test --no-audio-device
          lipo -archs build/macos-intel-release/bin/PadFlow.app/Contents/MacOS/PadFlow | grep x86_64
          lipo -archs build/macos-intel-release/lib/VST3/PadFlow.vst3/Contents/MacOS/PadFlow | grep x86_64
          lipo -archs build/macos-intel-release/lib/AU/PadFlow.component/Contents/MacOS/PadFlow | grep x86_64

  artifact-verification:
    runs-on: ubuntu-24.04
    needs: [windows-x64, macos-universal, macos-intel-smoke]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-development
          path: artifacts/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-development
          path: artifacts/macos
      - name: Verify all development artifacts
        run: |
          find artifacts -maxdepth 4 -type f -print | sort
          python3 scripts/verify-artifacts.py --mode milestone1 --platform windows --root artifacts/windows
          python3 scripts/verify-artifacts.py --mode milestone1 --platform macos --root artifacts/macos
